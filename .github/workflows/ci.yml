name: Kaveri Desk CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client & Sync SQLite
        run: |
          npx prisma generate
          npx prisma db push

      - name: Run Deterministic Unit Tests (Vitest)
        run: npm test

      - name: Run Next.js Production Build
        run: npm run build
        env:
          DATABASE_URL: 'file:./dev.db'
          NEXT_TELEMETRY_DISABLED: 1
