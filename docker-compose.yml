version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kaveri-postgres
    restart: always
    environment:
      POSTGRES_USER: kaveri
      POSTGRES_PASSWORD: kaveri_secure_password
      POSTGRES_DB: kaveri_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kaveri -d kaveri_db']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kaveri-desk-app
    restart: always
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://kaveri:kaveri_secure_password@postgres:5432/kaveri_db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
